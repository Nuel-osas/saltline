[package]
name = "saltline"
description = "Saltline's salvage economy: cargo as NEP-245 tokens, NPC brokers with wallets, and pricing rules anyone can read."
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.93"
repository = "https://github.com/Nuel-osas/saltline"

[lib]
crate-type = ["cdylib", "rlib"]

# Laid out as `cargo near new` (cargo-near 0.22.0) scaffolds a project, so builds follow its NEP-0330 metadata.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

# near-sdk 5.30.1 needs rustc 1.95; cargo-near 0.22.0's template pins Rust 1.93.0 with near-sdk 5.29, so this follows it.
[dependencies]
near-sdk = "5.29.1"

[dev-dependencies]
near-sdk = { version = "5.29.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
