# Sandbox test: deploys the release wasm (target/near/saltline.wasm, built by `cargo near build`) to a local
# nearcore sandbox and plays one loop. It is a separate crate so that the contract's own `cargo test` stays light.
[package]
name = "saltline-sandbox"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dev-dependencies]
near-workspaces = "=0.23.0"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
